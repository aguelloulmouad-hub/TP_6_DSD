[project]
name = "tp6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mouad Aguelloul", email = "aguelloulmouad@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
tp6 = "tp6:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
